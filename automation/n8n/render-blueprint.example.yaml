# DueCase n8n development blueprint.
# Based on Render's official n8n deployment pattern.
#
# IMPORTANT:
# - Free Render web services spin down after inactivity.
# - Free Render Postgres databases expire after 30 days.
# - Therefore this file is suitable for initial setup/testing, NOT 24/7 production automation.
# - For production, upgrade both resources before enabling scheduled Growth workflows.

services:
  - type: web
    plan: free
    runtime: image
    name: duecase-n8n
    image:
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: duecase-n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: duecase-n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: duecase-n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: duecase-n8n-db
          property: user
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"

# Keep the automation database separate from the DueCase application database.
databases:
  - name: duecase-n8n-db
    plan: free
