services:
  - type: web
    name: duecase-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: duecase-db
          property: connectionString

databases:
  - name: duecase-db
    plan: free
    region: frankfurt
    databaseName: duecase
    user: duecase
