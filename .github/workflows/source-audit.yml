name: Source consistency audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current source
        shell: bash
        run: |
          echo '=== IDENTITY REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude='package-lock.json' --exclude='source-audit.yml' 'tecnico-elios|eliostech' frontend backend website docs README.md 2>/dev/null || true
          echo '=== TAX CODE REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude='package-lock.json' --exclude='source-audit.yml' 'tax_code|taxCode|codice fiscale' frontend backend website docs README.md 2>/dev/null || true
          echo '=== LEGAL WORDING REFERENCES ==='
          grep -RInE --exclude-dir=node_modules --exclude='package-lock.json' --exclude='source-audit.yml' 'Conferma e Firma|firmare l.approvazione|firma elettronica|marca temporale|data certa|documento certificato|valore legale|probatori' frontend backend website docs README.md 2>/dev/null || true
