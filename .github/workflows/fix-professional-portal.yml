name: Fix professional portal UI

on:
  push:
    paths:
      - '.github/workflows/fix-professional-portal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fixes
        run: node .github/fix-professional-portal.mjs
      - name: Backend checks
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test -- --runInBand
      - name: Commit fixes
        run: |
          rm .github/fix-professional-portal.mjs .github/workflows/fix-professional-portal.yml
          git config user.name "DueCase Automation"
          git config user.email "info@duecaseununicasquadra.com"
          git add backend/public/professional-portal.html backend/public/professional-portal.js .github/fix-professional-portal.mjs .github/workflows/fix-professional-portal.yml
          git commit -m "Fix professional portal refresh and Italian labels"
          git push
