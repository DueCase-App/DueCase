name: Patch global keyboard dialogs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-global-keyboard-dialogs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove fixed dialog height caps that overflow behind keyboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r"(\bdialog\s*:\s*\{[^\n{}]*?)maxHeight\s*:\s*'92%'\s*,\s*")
          for path in Path('frontend/src').rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(r"\1", text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((str(path), count))
          if not changed:
              raise SystemExit('No dialog maxHeight anchors found')
          print('Patched:', changed)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck frontend
        working-directory: frontend
        run: npm ci && npm run typecheck
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "Let keyboard dialogs scroll instead of overflowing"
          git push
