name: Validate expense flow upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expense-flow-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify definitive expense flow wiring
        shell: bash
        run: |
          grep -q "rejectPayment:" frontend/src/services/api.ts
          grep -q "createSettlement:" frontend/src/services/api.ts
          grep -q "confirmSettlement:" frontend/src/services/api.ts
          grep -q "rejectSettlement:" frontend/src/services/api.ts
          grep -q "SET status = 'to_pay'" backend/src/routes/expenses.ts
          grep -q "payment_rejected" backend/src/routes/expensePayments.ts
          grep -q "settlement_confirmed" backend/src/routes/expensePayments.ts
          grep -q "confirmed >= due ? 'paid'" backend/src/routes/expensePayments.ts
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm ci && npm run typecheck
