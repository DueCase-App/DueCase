name: Patch professional portal settings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-professional-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settings patch
        run: python .github/patch_prof_settings.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and portal
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          node --check public/professional-portal.js
          npm test
      - name: Commit settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/029_professional_settings.sql backend/src/routes/professionalAuth.ts backend/public/professional-portal.html backend/public/professional-portal.js backend/public/professional-portal.css
          git commit -m "Add professional portal settings"
          git push
