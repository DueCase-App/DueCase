name: Wire full-screen expense page

on:
  push:
    paths:
      - '.github/workflows/one-time-new-expense-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ExpensesScreen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/screens/ExpensesScreen.tsx')
          s = p.read_text()

          imp = "import { NewExpensePage } from './NewExpensePage';\n"
          anchor = "import { useAuth } from '../context/AuthContext';\n"
          if imp not in s:
              s = s.replace(anchor, anchor + imp)

          marker = "  const cardWidth = width >= 1050 ? '48.8%' : '100%';\n"
          block = """  const cardWidth = width >= 1050 ? '48.8%' : '100%';\n\n  if (formVisible) {\n    return <NewExpensePage childrenList={children} onClose={() => setFormVisible(false)} onDone={() => { setFormVisible(false); void load(); }} />;\n  }\n"""
          if "return <NewExpensePage" not in s:
              s = s.replace(marker, block)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/ExpensesScreen.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use full-screen page for new expenses"
            git push
          fi
