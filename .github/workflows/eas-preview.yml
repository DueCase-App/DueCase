name: EAS Preview APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-preview.yml'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  preview-apk:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip eas]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Expo token is configured
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Verify Expo public configuration
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
        run: npx expo config --type public

      - name: Verify Android prebuild locally
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
          CI: '1'
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          tar --exclude='./android' --exclude='./ios' --exclude='./.git' -cf - . | tar -xf - -C "$TMP_DIR"
          cd "$TMP_DIR"
          npx expo prebuild --platform android --no-install --clean

      - name: Authenticate with Expo
        run: npx eas-cli@latest whoami

      - name: Build Preview APK and wait for result
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
        run: npx eas-cli@latest build --profile preview --platform android --non-interactive --wait

      - name: Show recent EAS builds
        if: always()
        run: npx eas-cli@latest build:list --platform android --limit 5 --non-interactive
