name: Android Preview APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-preview.yml'
      - 'frontend/**'
  pull_request:
    paths:
      - '.github/workflows/eas-preview.yml'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Configure Android push when Firebase configuration is available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/duecase-google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/duecase-google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::Firebase configuration missing: OS push must be configured and tested before store release."
          fi

      - name: Verify Expo public configuration
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
        run: npx expo config --type public

      - name: Build installable Android APK locally
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
          NODE_ENV: production
          CI: '1'
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          tar --exclude='./android' --exclude='./ios' --exclude='./.git' -cf - . | tar -xf - -C "$TMP_DIR"
          cd "$TMP_DIR"
          npx expo prebuild --platform android --no-install --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

          APP_VERSION="$(node -e "console.log(require(process.env.GITHUB_WORKSPACE + '/frontend/app.json').expo.version)")"
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="$GITHUB_WORKSPACE/frontend/DueCase-${APP_VERSION}.apk"

          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_DEST"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_DEST=$APK_DEST" >> "$GITHUB_ENV"

      - name: Verify Android JavaScript bundle locally
        env:
          EXPO_PUBLIC_API_URL: https://duecase-api.onrender.com/api
          NODE_ENV: production
          CI: '1'
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/duecase-expo-export"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DueCase-${{ env.APP_VERSION }}-Android
          path: ${{ env.APK_DEST }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
