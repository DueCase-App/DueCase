name: Quarantine unsigned DueCase APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-quarantine-unsigned-apk.yml'

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Remove incompatible APK asset and update prerelease note
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG='v0.4.4-preview'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" 'DueCase-0.4.4.apk' --yes || true
            gh release edit "$TAG" \
              --title 'DueCase 0.4.4 Preview - rigenerazione in corso' \
              --notes 'La precedente APK locale è stata rimossa perché aveva una firma Android diversa dalle build EAS già installate. Verrà sostituita dalla build 0.4.4 firmata con le credenziali EAS corrette.'
          fi
