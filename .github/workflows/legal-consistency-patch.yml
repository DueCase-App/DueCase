name: Apply legal consistency patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/legal-consistency-patch.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node tools/legal-consistency-patch.cjs
      - name: Typecheck frontend
        working-directory: frontend
        run: npm ci && npm run typecheck
      - name: Test backend
        working-directory: backend
        run: npm ci && npm run typecheck && npm test
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Info@duecaseununicasquadra.com"
          git config user.email "Info@duecaseununicasquadra.com"
          git add frontend backend website
          git commit -m "Align legal notices across DueCase"
          git push
