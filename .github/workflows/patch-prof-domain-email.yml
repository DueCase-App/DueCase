name: Patch professional domain and email

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-prof-domain-email.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch_prof_domain_email.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend and public portal
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          node --check ../website/professionisti/portal.js
          node --check ../website/professionisti/password-reset.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/030_professional_email_change.sql backend/src/routes/professionalEmailChange.ts backend/src/routes/professionalAuth.ts backend/src/routes/professionalPasswordReset.ts backend/src/services/emailService.ts backend/src/app.ts backend/src/routes/professionals.ts website/professionisti website/professionisti.html
          git commit -m "Publish professional portal on custom domain with verified email changes"
          git push
