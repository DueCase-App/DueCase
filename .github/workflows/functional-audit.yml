name: Functional audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Web bundle smoke build
        run: npx expo export --platform web --output-dir /tmp/duecase-web-audit
      - name: Production dependency audit
        run: npm audit --omit=dev --json || true
      - name: Scan interaction placeholders
        working-directory: .
        run: |
          echo '=== INCOMPLETE UI TEXT ==='
          grep -RInE --exclude-dir=node_modules --exclude='functional-audit.yml' 'TODO|FIXME|coming soon|non ancora (attiv|dispon|implement)|mock' frontend/src frontend/App.tsx 2>/dev/null || true
          echo '=== DISABLED CONSTANT CONTROLS ==='
          grep -RInE --exclude-dir=node_modules 'disabled=\{true\}|onPress=\{\(\)=>\{\}\}|onPress=\{undefined\}' frontend/src frontend/App.tsx 2>/dev/null || true
          echo '=== APP SCREENS ==='
          find frontend/src/screens -maxdepth 1 -type f -name '*Screen.tsx' -printf '%f\n' | sort

  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Route and safety scan
        working-directory: .
        run: |
          echo '=== MOUNTED BACKEND ROUTES ==='
          grep -nE "app\.use\('/api|app\.get\('/api" backend/src/app.ts || true
          echo '=== TODO / FIXME / TEMPORARY SERVER LOGIC ==='
          grep -RInE --exclude-dir=node_modules 'TODO|FIXME|temporary|temporaneo|mock|bypass' backend/src 2>/dev/null || true
