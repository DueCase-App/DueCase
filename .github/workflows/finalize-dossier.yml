name: Finalize DueCase dossier readability

on:
  push:
    paths:
      - '.github/workflows/finalize-dossier.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dossier improvements
        run: node .github/finalize-dossier.mjs
      - name: Backend checks
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test -- --runInBand
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit final changes
        run: |
          rm .github/workflows/finalize-dossier.yml .github/finalize-dossier.mjs
          git config user.name "DueCase Automation"
          git config user.email "info@duecaseununicasquadra.com"
          git add backend/src/services/dossierService.ts .github/workflows/finalize-dossier.yml .github/finalize-dossier.mjs
          git commit -m "Improve dossier readability and payment labels"
          git push
